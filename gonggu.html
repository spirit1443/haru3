<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공구 수익 계산기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 상품 카드를 위에서 아래로 쌓고, 맨 아래 합계 카드에서 실수령액을 크게 보여준다. */
  :root {
    --bg: #f3f6f5; --card: #fff; --text: #1b2321; --muted: #66746f; --line: #e1e8e5;
    --accent: #0f8a6a; --accent-soft: #e2f3ed; --on-accent: #fff;
    --warn: #b45309; --warn-soft: #fdf2e3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111615; --card: #1a2120; --text: #e8efec; --muted: #94a59f; --line: #29322f;
      --accent: #3ccf9f; --accent-soft: #173229; --on-accent: #0b1513;
      --warn: #f5a524; --warn-soft: #33260f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111615; --card: #1a2120; --text: #e8efec; --muted: #94a59f; --line: #29322f;
    --accent: #3ccf9f; --accent-soft: #173229; --on-accent: #0b1513;
    --warn: #f5a524; --warn-soft: #33260f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  main {
    max-width: 520px; margin: 0 auto; padding-block: 16px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card-head h2 { font-size: 18px; margin: 0; }
  .del { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 4px 8px; flex: none; }
  label.field { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text] {
    width: 100%; font-size: 17px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text); text-align: right; font-variant-numeric: tabular-nums;
  }
  input.name { text-align: left; font-weight: 600; }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .rule { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 6px; align-items: center; margin-top: 12px; }
  .rule span { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .rate { margin-top: 6px; font-size: 13px; color: var(--accent); font-weight: 600; text-align: right; }
  .sales { margin-top: 14px; }
  .earn { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--accent-soft); display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums; }
  .earn b { font-size: 22px; color: var(--accent); }
  .warn { margin-top: 12px; color: var(--warn); background: var(--warn-soft); padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .btn { display: block; width: 100%; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px dashed var(--accent); background: none; color: var(--accent); cursor: pointer; margin-bottom: 14px; }
  .btn.solid { border-style: solid; background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .btn.ghost { border: none; color: var(--muted); font-size: 14px; }
  .btn.ghost.armed { color: var(--warn); font-weight: 700; }
  .lines { display: grid; gap: 8px; font-variant-numeric: tabular-nums; }
  .lines div { display: flex; justify-content: space-between; gap: 8px; }
  .lines .k { color: var(--muted); }
  .net { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .net b { font-size: 28px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted); }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  #copy-fallback { width: 100%; min-height: 160px; margin-bottom: 14px; font: 14px/1.5 inherit; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>공구 수익 계산기</h1>
  <p class="sub">"○원 팔면 ○원 받음" 규칙과 현재 매출을 넣으면 번 돈과 3.3% 뗀 실수령액을 계산해요.</p>
  <div id="items"></div>
  <button class="btn" id="add">+ 상품 추가</button>
  <section class="card" id="total"></section>
  <button class="btn solid" id="copy">결과 복사</button>
  <textarea id="copy-fallback" readonly hidden aria-label="복사할 결과"></textarea>
  <button class="btn ghost" id="reset">초기화</button>
</main>
<div class="toast" id="toast"></div>

<script id="calc">
// 화면과 테스트가 함께 쓰는 순수 계산 함수.
const TAX_RATE = 0.033;
const num = (v) => Math.max(0, Math.floor(Number(v) || 0));

// 상품 하나: sellBase원 팔면 receive원 받는다 → 매출 sales원일 때 번 돈.
function calcItem(it) {
  const sellBase = num(it.sellBase), receive = num(it.receive), sales = num(it.sales);
  const base = { sellBase, receive, sales, rate: sellBase ? receive / sellBase : 0, earn: 0 };
  if (!sellBase) return receive || sales ? { ...base, error: '판매 기준 금액을 입력해 주세요' } : base;
  return { ...base, earn: Math.floor((sales * receive) / sellBase), notice: receive > sellBase ? '받는 돈이 판매액보다 커요. 입력을 확인해 주세요' : '' };
}

// 전체 합계와 세금(원천징수처럼 10원 미만은 버림).
function calcAll(items, taxOn = true) {
  const results = items.map(calcItem);
  const sales = results.reduce((a, x) => a + x.sales, 0);
  const earn = results.reduce((a, x) => a + x.earn, 0);
  const tax = taxOn ? Math.floor((earn * TAX_RATE) / 10) * 10 : 0;
  return { results, sales, earn, tax, net: earn - tax, ok: results.every((x) => !x.error) };
}
</script>

<script>
const KEY = 'gonggu-profit-v1';
const won = (v) => (Number(v) || 0).toLocaleString('ko-KR');
const pct = (r) => `${(Math.round(r * 1000) / 10).toLocaleString('ko-KR')}%`;
const digits = (s) => String(s).replace(/[^\d]/g, '');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const blank = (prev) => ({ name: '', sellBase: prev ? prev.sellBase : '', receive: prev ? prev.receive : '', sales: '' });

let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch { state = null; }
if (!state || !Array.isArray(state.items) || !state.items.length) state = { items: [blank()], taxOn: true };

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
const $ = (s, el = document) => el.querySelector(s);

function money(i, key, ph) {
  const v = state.items[i][key];
  return `<input type="text" inputmode="numeric" id="${key}${i}" data-i="${i}" data-k="${key}" value="${v === '' ? '' : won(v)}" placeholder="${ph}">`;
}

function renderItems() {
  $('#items').innerHTML = state.items.map((it, i) => `
    <section class="card" data-card="${i}">
      <div class="card-head">
        <input type="text" class="name" id="name${i}" data-i="${i}" data-name value="${esc(it.name)}" placeholder="상품 ${i + 1}" aria-label="상품 이름">
        ${i > 0 ? `<button class="del" data-del="${i}">삭제</button>` : ''}
      </div>
      <label class="field">수익 규칙</label>
      <div class="rule">${money(i, 'sellBase', '10,000')}<span>원 팔면</span>${money(i, 'receive', '1,500')}<span>원 받음</span></div>
      <div class="rate" data-rate></div>
      <div class="sales"><label class="field" for="sales${i}">현재 매출 (원)</label>${money(i, 'sales', '2,340,000')}</div>
      <div data-out></div>
    </section>`).join('');
  update();
}

function update() {
  const s = calcAll(state.items, state.taxOn);
  s.results.forEach((x, i) => {
    const card = $(`[data-card="${i}"]`);
    $('[data-rate]', card).textContent = x.sellBase ? `수익률 ${pct(x.rate)}` : '';
    $('[data-out]', card).innerHTML = x.error
      ? `<div class="warn">${x.error}</div>`
      : `<div class="earn"><span>번 돈</span><b>${won(x.earn)}원</b></div>${x.notice ? `<div class="warn">${x.notice}</div>` : ''}`;
  });
  $('#total').innerHTML = `
    <div class="card-head"><h2>합계</h2></div>
    <div class="lines">
      <div><span class="k">총 매출</span><span>${won(s.sales)}원</span></div>
      <div><span class="k">번 돈</span><span>${won(s.earn)}원</span></div>
      <div><label class="toggle"><input type="checkbox" id="taxOn" ${state.taxOn ? 'checked' : ''}>세금 3.3% 떼기</label><span>${state.taxOn ? `−${won(s.tax)}원` : '-'}</span></div>
    </div>
    <div class="net"><span>실수령액</span><b>${won(s.net)}원</b></div>
    ${s.ok ? '' : '<div class="warn">경고가 있는 상품은 합계에서 빠져 있어요.</div>'}`;
  return s;
}

function shareText() {
  const s = calcAll(state.items, state.taxOn);
  const lines = ['[공구 수익]'];
  s.results.forEach((x, i) => {
    const name = state.items[i].name || `상품 ${i + 1}`;
    if (x.error) { lines.push(`${name}: 확인 필요 (${x.error})`); return; }
    lines.push(`${name}: 매출 ${won(x.sales)}원 × ${pct(x.rate)} = ${won(x.earn)}원`);
  });
  lines.push(`총 매출 ${won(s.sales)}원 / 번 돈 ${won(s.earn)}원`);
  if (state.taxOn) lines.push(`세금 3.3% −${won(s.tax)}원`);
  lines.push(`실수령액 ${won(s.net)}원`);
  return lines.join('\n');
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1600);
}

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.name !== undefined) { state.items[+el.dataset.i].name = el.value; save(); return; }
  if (!el.dataset.k) return;
  const raw = digits(el.value).replace(/^0+(?=\d)/, '');
  state.items[+el.dataset.i][el.dataset.k] = raw;
  const pos = el.value.length - el.selectionStart;
  el.value = raw === '' ? '' : won(raw);
  const p = Math.max(0, el.value.length - pos); el.setSelectionRange(p, p);
  update(); save();
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'taxOn') { state.taxOn = e.target.checked; update(); save(); }
});

document.addEventListener('click', (e) => {
  const del = e.target.closest('[data-del]');
  if (del) { state.items.splice(+del.dataset.del, 1); renderItems(); save(); }
});

$('#add').onclick = () => { state.items.push(blank(state.items[state.items.length - 1])); renderItems(); save(); };

// 초기화는 두 번 눌러야 실행된다(확인창 대신).
$('#reset').onclick = (e) => {
  const b = e.currentTarget;
  if (!b.classList.contains('armed')) {
    b.classList.add('armed'); b.textContent = '한 번 더 누르면 모두 지워져요';
    clearTimeout(b.t); b.t = setTimeout(() => { b.classList.remove('armed'); b.textContent = '초기화'; }, 3000);
    return;
  }
  clearTimeout(b.t); b.classList.remove('armed'); b.textContent = '초기화';
  state = { items: [blank()], taxOn: true }; $('#copy-fallback').hidden = true; renderItems(); save(); toast('초기화했어요');
};

$('#copy').onclick = () => {
  const text = shareText();
  const fb = $('#copy-fallback');
  const fallback = () => { fb.value = text; fb.hidden = false; fb.focus(); fb.select(); toast('아래 글을 길게 눌러 복사하세요'); };
  try {
    navigator.clipboard.writeText(text).then(() => { fb.hidden = true; toast('복사했어요'); }, fallback);
  } catch { fallback(); }
};

renderItems();
</script>
</body>
</html>
