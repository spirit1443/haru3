<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>남녀 더치페이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1d1f23; --muted: #6b7280; --line: #e5e7eb;
    --accent: #3b6ef5; --accent-soft: #e8eefe; --male: #2f6fde; --female: #d9468a;
    --warn: #c2410c; --warn-soft: #fff1e8; --ok: #15803d; --ok-soft: #e7f6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121317; --card: #1c1e24; --text: #ececf1; --muted: #9ca3af; --line: #2c2f37;
      --accent: #7b9cff; --accent-soft: #24304f; --male: #79a6ff; --female: #f27bb5;
      --warn: #fb923c; --warn-soft: #3a2416; --ok: #4ade80; --ok-soft: #173224;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121317; --card: #1c1e24; --text: #ececf1; --muted: #9ca3af; --line: #2c2f37;
    --accent: #7b9cff; --accent-soft: #24304f; --male: #79a6ff; --female: #f27bb5;
    --warn: #fb923c; --warn-soft: #3a2416; --ok: #4ade80; --ok-soft: #173224;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  main {
    max-width: 520px; margin: 0 auto; padding-block: 16px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #copy-fallback { width: 100%; min-height: 160px; margin-bottom: 14px; font: 14px/1.5 inherit; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
  .btn.ghost.armed { color: var(--warn); font-weight: 700; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .card-head h2 { font-size: 18px; margin: 0; }
  .del { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 4px 8px; }
  label.field { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text] {
    width: 100%; font-size: 17px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text); text-align: right; font-variant-numeric: tabular-nums;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .row { display: grid; grid-template-columns: 56px 1fr 1.6fr; gap: 8px; align-items: end; margin-top: 12px; }
  .tag { font-weight: 700; padding-bottom: 10px; }
  .tag.m { color: var(--male); } .tag.w { color: var(--female); }
  .bill { margin-top: 14px; }
  .calc { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-variant-numeric: tabular-nums; font-size: 14px; }
  .calc div { display: flex; justify-content: space-between; }
  .calc .left { font-size: 16px; font-weight: 700; margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--line); }
  .calc.neg { background: var(--warn-soft); color: var(--warn); }
  .seg { display: grid; gap: 6px; margin-top: 10px; }
  .seg.two { grid-template-columns: 1fr 1fr; }
  .seg.four { grid-template-columns: 1fr 1fr; }
  .seg label { text-align: center; border: 1px solid var(--line); border-radius: 10px; padding: 9px 4px; font-size: 14px; cursor: pointer; }
  .seg input { display: none; }
  .seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .seg-title { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .result { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .result .box { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .result .k { font-size: 13px; color: var(--muted); }
  .result .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .result .s { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .result .m .v { color: var(--male); } .result .w .v { color: var(--female); }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .carry { margin-top: 12px; color: var(--ok); background: var(--ok-soft); padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .warn { margin-top: 12px; color: var(--warn); background: var(--warn-soft); padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .btn { display: block; width: 100%; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px dashed var(--accent); background: none; color: var(--accent); cursor: pointer; margin-bottom: 14px; }
  .btn.solid { border-style: solid; background: var(--accent); color: #fff; font-weight: 700; }
  .btn.ghost { border: none; color: var(--muted); font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
  th, td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 13px; color: var(--muted); font-weight: 500; }
  tr.total td { font-weight: 700; border-bottom: none; }
  .summary-foot { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .nw { white-space: nowrap; }
  [hidden] { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>남녀 더치페이</h1>
  <p class="sub">남녀별로 정한 금액을 먼저 걷고, 실제 결제하고 남은 돈을 돌려주거나 다음 차수로 넘겨요. 환급액은 1,000원 단위로 내려요.</p>
  <div id="rounds"></div>
  <button class="btn" id="add">+ 차수 추가</button>
  <section class="card" id="summary"></section>
  <button class="btn solid" id="copy">결과 복사</button>
  <textarea id="copy-fallback" readonly hidden aria-label="복사할 정산 결과"></textarea>
  <button class="btn ghost" id="reset">초기화</button>
</main>
<div class="toast" id="toast"></div>

<script id="calc">
// 화면과 테스트가 함께 쓰는 순수 계산 함수.
const UNIT = 1000;
const num = (v) => Math.max(0, Math.floor(Number(v) || 0));
const floorUnit = (v) => Math.floor(v / UNIT) * UNIT;

// 한 차수: 걷은 돈 + 이월금 − 결제 = 남은 돈. 남은 돈은 돌려주거나 다음 차수로 넘긴다.
// split: 'm' 남자만, 'eq' 남녀 같게, 'ratio' 남녀 낸 비율대로, 'w' 여자만
function calcRound(r, carryIn = 0, isLast = true) {
  const m = num(r.m), mAmt = num(r.mAmt), w = num(r.w), wAmt = num(r.wAmt), bill = num(r.bill);
  const split = r.split || 'eq';
  const mode = isLast ? 'refund' : (r.mode || 'refund');
  const collected = m * mAmt + w * wAmt;
  const pool = collected + carryIn;
  const left = pool - bill;
  const base = { m, w, mAmt, wAmt, bill, collected, carryIn, pool, left, split, mode, carryOut: 0 };
  if (left < 0) return { ...base, error: `${-left}원 모자라요` };
  if (mode === 'carry') return { ...base, mRefund: 0, wRefund: 0, mNet: mAmt, wNet: wAmt, refunded: 0, keep: 0, carryOut: left };

  let mRefund = 0, wRefund = 0;
  if (left > 0) {
    if (split === 'm') {
      if (!m) return { ...base, error: '돌려받을 남자가 없어요' };
      mRefund = floorUnit(left / m);
    } else if (split === 'w') {
      if (!w) return { ...base, error: '돌려받을 여자가 없어요' };
      wRefund = floorUnit(left / w);
    } else if (split === 'ratio') {
      if (!collected) return { ...base, error: '이번 차수에 걷은 돈이 없어 비율을 계산할 수 없어요' };
      mRefund = floorUnit((left * mAmt) / collected);
      wRefund = floorUnit((left * wAmt) / collected);
    } else {
      if (!(m + w)) return { ...base, error: '돌려받을 사람이 없어요' };
      mRefund = wRefund = floorUnit(left / (m + w));
    }
  }
  const refunded = m * mRefund + w * wRefund;
  return { ...base, mRefund, wRefund, mNet: mAmt - mRefund, wNet: wAmt - wRefund, refunded, keep: left - refunded };
}

// 모든 차수를 차례로 계산하고 합산한다.
function calcAll(rounds) {
  let carry = 0;
  const results = rounds.map((r, i) => {
    const x = calcRound(r, carry, i === rounds.length - 1);
    carry = x.carryOut;
    return x;
  });
  const ok = results.every((x) => !x.error);
  const sum = (k) => results.reduce((a, x) => a + (x[k] || 0), 0);
  return {
    results, ok,
    mTotal: sum('mNet'), wTotal: sum('wNet'),
    bill: sum('bill'), collected: sum('collected'), refunded: sum('refunded'), keep: sum('keep'),
  };
}
</script>

<script>
const KEY = 'dutch-pay-v2';
const SPLITS = [['m', '남자만'], ['eq', '남녀 같게'], ['ratio', '남녀 낸 비율대로'], ['w', '여자만']];
const SPLIT_LABEL = Object.fromEntries(SPLITS);
const won = (v) => (Number(v) || 0).toLocaleString('ko-KR');
const digits = (s) => String(s).replace(/[^\d]/g, '');
const blank = (prev) => ({ m: prev ? prev.m : '', mAmt: '', w: prev ? prev.w : '', wAmt: '', bill: '', split: 'eq', mode: 'refund' });

let rounds;
try { rounds = JSON.parse(localStorage.getItem(KEY)); } catch { rounds = null; }
if (!Array.isArray(rounds) || !rounds.length) rounds = [blank()];

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rounds)); } catch {} };
const $ = (s, el = document) => el.querySelector(s);

function input(i, key, label, money) {
  const v = rounds[i][key];
  const shown = v === '' ? '' : (money ? won(v) : v);
  return `<div><label class="field">${label}</label><input type="text" inputmode="numeric" data-i="${i}" data-k="${key}" data-money="${money ? 1 : ''}" value="${shown}" placeholder="0"></div>`;
}

function radios(i, name, items, current) {
  return items.map(([v, t]) => `<label><input type="radio" name="${name}${i}" data-i="${i}" data-r="${name}" value="${v}" ${current === v ? 'checked' : ''}><span>${t}</span></label>`).join('');
}

function renderRounds() {
  const last = rounds.length - 1;
  $('#rounds').innerHTML = rounds.map((r, i) => `
    <section class="card" data-card="${i}">
      <div class="card-head"><h2>${i + 1}차</h2>${i > 0 ? `<button class="del" data-del="${i}">삭제</button>` : ''}</div>
      <div class="row"><span class="tag m">남자</span>${input(i, 'm', '인원', false)}${input(i, 'mAmt', '1인당 걷는 돈', true)}</div>
      <div class="row"><span class="tag w">여자</span>${input(i, 'w', '인원', false)}${input(i, 'wAmt', '1인당 걷는 돈', true)}</div>
      <div class="bill">${input(i, 'bill', '실제 결제 금액 (원)', true)}</div>
      <div class="calc" data-calc></div>
      ${i < last ? `<div class="seg-title">남은 돈</div><div class="seg two">${radios(i, 'mode', [['refund', '돌려주기'], ['carry', `${i + 2}차로 넘기기`]], r.mode || 'refund')}</div>` : ''}
      <div data-split-wrap><div class="seg-title">누구에게 돌려줄까요?</div><div class="seg four">${radios(i, 'split', SPLITS, r.split || 'eq')}</div></div>
      <div data-out></div>
    </section>`).join('');
  update();
}

function updateCard(i, x) {
  const card = $(`[data-card="${i}"]`);
  const calc = $('[data-calc]', card);
  calc.className = 'calc' + (x.left < 0 ? ' neg' : '');
  calc.innerHTML = `
    <div><span>걷은 돈</span><span>${won(x.collected)}원</span></div>
    ${x.carryIn ? `<div><span>${i}차에서 넘어온 돈</span><span>+${won(x.carryIn)}원</span></div>` : ''}
    <div><span>실제 결제</span><span>−${won(x.bill)}원</span></div>
    <div class="left"><span>${x.left < 0 ? '모자란 돈' : '남은 돈'}</span><span>${won(Math.abs(x.left))}원</span></div>`;
  $('[data-split-wrap]', card).hidden = x.mode === 'carry';
  const out = $('[data-out]', card);
  if (x.error) { out.innerHTML = `<div class="warn">${x.error.replace(/^\d+/, (d) => won(d))}</div>`; return; }
  if (x.mode === 'carry') { out.innerHTML = `<div class="carry">남은 ${won(x.left)}원을 ${i + 2}차로 넘겨요</div>`; return; }
  out.innerHTML = `
    <div class="result">
      <div class="box m"><div class="k">남자 1인당 돌려받기</div><div class="v">${won(x.mRefund)}원</div><div class="s">실제 부담 ${won(x.mNet)}원</div></div>
      <div class="box w"><div class="k">여자 1인당 돌려받기</div><div class="v">${won(x.wRefund)}원</div><div class="s">실제 부담 ${won(x.wNet)}원</div></div>
    </div>
    <div class="note"><span class="nw">돌려주는 돈 ${won(x.refunded)}원</span>${x.keep ? ` · <span class="nw">총무 몫 ${won(x.keep)}원</span>` : ''}</div>`;
}

function update() {
  const s = calcAll(rounds);
  s.results.forEach((x, i) => updateCard(i, x));
  const rows = s.results.map((x, i) => `<tr><td>${i + 1}차${x.mode === 'carry' && !x.error ? ' (이월)' : ''}</td><td>${x.error ? '-' : won(x.mNet)}</td><td>${x.error ? '-' : won(x.wNet)}</td></tr>`).join('');
  $('#summary').innerHTML = `
    <div class="card-head"><h2>1인당 실제 부담</h2></div>
    <table>
      <tr><th>차수</th><th>남자</th><th>여자</th></tr>
      ${rows}
      ${rounds.length > 1 ? `<tr class="total"><td>전 차수 참석</td><td>${won(s.mTotal)}</td><td>${won(s.wTotal)}</td></tr>` : ''}
    </table>
    <div class="summary-foot">${s.ok
      ? `<span class="nw">총 결제 ${won(s.bill)}원</span> · <span class="nw">걷은 돈 ${won(s.collected)}원</span> · <span class="nw">돌려준 돈 ${won(s.refunded)}원</span>${s.keep ? ` · <span class="nw">총무 몫 ${won(s.keep)}원</span>` : ''}`
      : '경고가 있는 차수를 먼저 고쳐 주세요.'}</div>`;
  return s;
}

function shareText() {
  const s = calcAll(rounds);
  const lines = ['[더치페이 정산]'];
  s.results.forEach((x, i) => {
    lines.push(`${i + 1}차: 남${x.m}명 ${won(x.mAmt)}원, 여${x.w}명 ${won(x.wAmt)}원 걷음${x.carryIn ? ` (+이월 ${won(x.carryIn)}원)` : ''} / 결제 ${won(x.bill)}원`);
    if (x.error) lines.push(`  확인 필요: ${x.error.replace(/^\d+/, (d) => won(d))}`);
    else if (x.mode === 'carry') lines.push(`  남은 ${won(x.left)}원은 ${i + 2}차로 넘김`);
    else {
      lines.push(`  남은 ${won(x.left)}원 ${SPLIT_LABEL[x.split]} 환급: 남자 ${won(x.mRefund)}원 / 여자 ${won(x.wRefund)}원 돌려받기`);
      if (x.keep) lines.push(`  총무 몫 ${won(x.keep)}원`);
    }
  });
  if (s.ok) lines.push(`1인당 실제 부담${rounds.length > 1 ? '(전 차수 참석)' : ''}: 남자 ${won(s.mTotal)}원 / 여자 ${won(s.wTotal)}원`);
  return lines.join('\n');
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1600);
}

document.addEventListener('input', (e) => {
  const el = e.target;
  if (!el.dataset.k) return;
  const i = +el.dataset.i, raw = digits(el.value).replace(/^0+(?=\d)/, '');
  rounds[i][el.dataset.k] = raw;
  if (el.dataset.money) {
    const pos = el.value.length - el.selectionStart;
    el.value = raw === '' ? '' : won(raw);
    const p = Math.max(0, el.value.length - pos); el.setSelectionRange(p, p);
  } else el.value = raw;
  update(); save();
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.type !== 'radio') return;
  rounds[+el.dataset.i][el.dataset.r] = el.value;
  update(); save();
});

document.addEventListener('click', (e) => {
  const del = e.target.closest('[data-del]');
  if (del) { rounds.splice(+del.dataset.del, 1); renderRounds(); save(); }
});

$('#add').onclick = () => { rounds.push(blank(rounds[rounds.length - 1])); renderRounds(); save(); };
// 초기화는 두 번 눌러야 실행된다(확인창 대신).
$('#reset').onclick = (e) => {
  const b = e.currentTarget;
  if (!b.classList.contains('armed')) {
    b.classList.add('armed'); b.textContent = '한 번 더 누르면 모두 지워져요';
    clearTimeout(b.t); b.t = setTimeout(() => { b.classList.remove('armed'); b.textContent = '초기화'; }, 3000);
    return;
  }
  clearTimeout(b.t); b.classList.remove('armed'); b.textContent = '초기화';
  rounds = [blank()]; $('#copy-fallback').hidden = true; renderRounds(); save(); toast('초기화했어요');
};
$('#copy').onclick = () => {
  const text = shareText();
  const fb = $('#copy-fallback');
  const fallback = () => { fb.value = text; fb.hidden = false; fb.focus(); fb.select(); toast('아래 글을 길게 눌러 복사하세요'); };
  try {
    navigator.clipboard.writeText(text).then(() => { fb.hidden = true; toast('복사했어요. 카톡에 붙여넣으세요'); }, fallback);
  } catch { fallback(); }
};

renderRounds();
</script>
</body>
</html>
